name: Proteus

options:
  bundleIdPrefix: local.proteus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ProteusKit:
    path: ProteusKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

targets:
  Proteus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Proteus
        excludes:
          - Info.plist
    dependencies:
      - package: ProteusKit
        product: ProteusKit
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.proteus.app
        PRODUCT_NAME: Proteus
        INFOPLIST_FILE: Proteus/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO

schemes:
  Proteus:
    build:
      targets:
        Proteus: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
