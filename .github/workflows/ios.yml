name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Owner-data scan (generic patterns only)
        run: scripts/owner-scan.sh --generic-only

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Test ProteusKit
        working-directory: ios/ProteusKit
        run: swift test

      - name: Archive unsigned
        working-directory: ios
        run: |
          xcodebuild -scheme Proteus -skipPackagePluginValidation -skipMacroValidation \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/Proteus.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Proteus.xcarchive/Products/Applications/Proteus.app Payload/
          zip -qry Proteus.ipa Payload
          ls -lh Proteus.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Proteus-ipa
          path: ios/Proteus.ipa

      - name: Build for simulator
        continue-on-error: true
        working-directory: ios
        run: |
          xcodebuild -project Proteus.xcodeproj -scheme Proteus -skipPackagePluginValidation -skipMacroValidation \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$PWD/build-sim" \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture demo screenshots
        continue-on-error: true
        working-directory: ios
        run: |
          set -euo pipefail
          APP="$(find build-sim/Build/Products/Release-iphonesimulator -maxdepth 1 -name 'Proteus.app' -print -quit)"
          test -n "$APP"
          DEVICE="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator runtime"; exit 1
          fi
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"

          mkdir -p screens
          capture() {
            local screen="$1"
            xcrun simctl terminate "$DEVICE" local.proteus.app >/dev/null 2>&1 || true
            if [ "$screen" = "chats" ]; then
              xcrun simctl launch "$DEVICE" local.proteus.app -ProteusDemo
            else
              xcrun simctl launch "$DEVICE" local.proteus.app -ProteusDemo -ProteusDemoScreen="$screen"
            fi
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "screens/$screen.png"
          }

          for screen in chats agents project terminal settings; do
            capture "$screen"
          done
          ls -lh screens

      - name: Upload screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-screens
          path: ios/screens
